# Broad AI service baseline for Mihomo/Clash rule mode. Not an exhaustive allowlist.
# Replace 🔰 节点选择 with the exact name of an existing proxy group whose current
# leaf is not DIRECT; do not target DIRECT or REJECT here.
# In Clash Verge Rev's Edit Rules prepend box, paste only the rule text: strip
# "prepend:", the leading "- ", and the double quotes. When editing the profile's
# rules-extension YAML directly, use this file as-is.
# Keep them before the subscription's own rules; do not add MATCH or GEOIP here.
# Shared login, risk-control, feature-flag and voice hosts are grouped separately;
# they also carry traffic for other sites, so remove that group if the tradeoff is
# not acceptable.
# Telemetry-only hosts (Datadog, Sentry, Fathom, Qualtrics) are intentionally omitted.
# Domestic AI services (deepseek.com, tongyi.aliyun.com, doubao.com, chatglm.cn) are
# intentionally not included; keep them on the subscription's direct/CN path.

