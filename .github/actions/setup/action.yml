name: Setup
description: Install pnpm + Node (pinned) and run a frozen-lockfile install.

inputs:
  node-version:
    description: Supported Node runtime used for this validation job.
    required: false
    default: '22.22.3'
  registry-url:
    description: npm registry URL. Set it on the release job so NODE_AUTH_TOKEN takes effect.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/setup@v2
      with:
        install: false

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
      env:
        PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
