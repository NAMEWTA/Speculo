name: Prepare authorized v1.0.24
on:
  push:
    branches: [automation/release-1.0.24-prepare]
permissions:
  contents: write
concurrency:
  group: prepare-speculo-v1.0.24
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'NAMEWTA/Speculo' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3b639f4b2a0af9fef770c8db58fda2b389f9f802
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check exact source, tag and npm target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3b639f4b2a0af9fef770c8db58fda2b389f9f802
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3b639f4b2a0af9fef770c8db58fda2b389f9f802
          test -z "$(git ls-remote origin refs/tags/v1.0.24)"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@namewta%2fspeculo', { signal: AbortSignal.timeout(30000) });
          assert.equal(response.status, 200, 'npm metadata must be readable');
          const metadata = await response.json();
          assert.ok(!metadata.versions['1.0.24'], 'target version already exists; reconcile before retrying');
          const latest = metadata['dist-tags'].latest;
          assert.match(latest, /^1\.0\.\d+$/);
          assert.ok(Number(latest.split('.')[2]) < 24, 'unexpected newer release');
          const receipt = { package: '@namewta/speculo', target: '1.0.24', latest, version_1_0_23_published: Boolean(metadata.versions['1.0.23']), target_exists: false };
          writeFileSync(process.env.RUNNER_TEMP+'/registry-preflight.json', JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          JS
      - name: Apply narrowly scoped release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/NAMEWTA/Speculo/contents/.release-prepare-1.0.24.mjs?ref=$PREPARATION_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/prepare.mjs"
          node "$RUNNER_TEMP/prepare.mjs"
      - name: Run complete project checks
        run: |
          set -euo pipefail
          pnpm check 2>&1 | tee "$RUNNER_TEMP/check.log"
          pnpm verify-bin 2>&1 | tee "$RUNNER_TEMP/verify-bin.log"
          pnpm generate-canonical 2>&1 | tee "$RUNNER_TEMP/generation.log"
          git diff --exit-code -- template/canonical
          pnpm generate-canonical > "$RUNNER_TEMP/generation-second.log"
          git diff --exit-code -- template/canonical
          git diff --check
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/pack.json','utf8'));
          assert.equal(pack.name,'@namewta/speculo');
          assert.equal(pack.version,'1.0.24');
          assert.ok(pack.files.some(f=>f.path==='dist/src/cli.js'));
          assert.ok(pack.files.some(f=>f.path==='template/workflows/specdev/common/tools/engineering-evidence.mjs'));
          assert.ok(!pack.files.some(f=>f.path.startsWith('.github/')||f.path.startsWith('.release-')));
          console.log('Package contents verified:',pack.name,pack.version,pack.files.length);
          JS
      - name: Store validated commit without moving main or a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 3b639f4b2a0af9fef770c8db58fda2b389f9f802
          git add -- package.json CHANGELOG.md .github/workflows/release.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git diff --cached --check
          git diff --cached -- > "$RUNNER_TEMP/release.patch"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const api = (endpoint, body) => JSON.parse(execFileSync('gh', ['api','--method','POST','repos/NAMEWTA/Speculo/'+endpoint,'--input','-'], {input:JSON.stringify(body),encoding:'utf8'}));
          const paths = ['.github/workflows/release.yml','CHANGELOG.md','package.json'];
          const entries = paths.map(path => ({path, mode:'100644', type:'blob', sha:api('git/blobs',{content:readFileSync(path,'utf8'),encoding:'utf-8'}).sha}));
          const tree = api('git/trees',{base_tree:'061626491bc3d2779f2fcbc553c3e28292d5ffef',tree:entries});
          assert.equal(tree.sha,execFileSync('git',['write-tree'],{encoding:'utf8'}).trim());
          const commit = api('git/commits',{message:'chore(release): prepare v1.0.24\n\nRelease the merged SpecDev Work upgrade; preserve runtime state and add tag-only dispatch to the existing release workflow. AI-assisted release preparation.',tree:tree.sha,parents:['3b639f4b2a0af9fef770c8db58fda2b389f9f802']});
          writeFileSync(process.env.RUNNER_TEMP+'/prepared-sha.txt',commit.sha+'\n');
          console.log('VALIDATED_RELEASE_COMMIT='+commit.sha);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-1.0.24-preparation
          path: |
            ${{ runner.temp }}/registry-preflight.json
            ${{ runner.temp }}/prepared-sha.txt
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/release-notes-1.0.24.md
            ${{ runner.temp }}/check.log
            ${{ runner.temp }}/verify-bin.log
            ${{ runner.temp }}/generation*.log
            ${{ runner.temp }}/pack.json
          retention-days: 7
