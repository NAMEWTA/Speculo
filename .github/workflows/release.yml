name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    name: Stage release for npm approval
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "Version verified: v$PACKAGE_VERSION"

      - name: Test and validate assets
        run: pnpm check

      - name: Verify bin entry
        run: |
          pnpm verify-bin
          pnpm verify-package

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\["v"\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found && /^---[[:space:]]*$/ { next }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md 中未找到 [$VERSION] 段落，回退到自动生成。"
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." > release-notes.md
          fi

      - name: Upgrade npm CLI for staged publishing
        run: npm install -g npm@latest

      - name: Stage package on npm for maintainer approval
        run: npm stage publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm staging
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const stages = JSON.parse(execFileSync('npm', ['stage', 'list', name, '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' }));
          const staged = stages.find(item => item.packageName === name && item.version === version && item.tag === 'latest');
          if (!staged?.id) throw new Error(`No staged latest release found for ${name}@${version}`);
          const summary = `${name}@${version} staged successfully. Stage ID: ${staged.id}.\n\nAwaiting maintainer approval with 2FA in npmjs.com → Staged Packages. This version is not public until approved.\n`;
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          appendFileSync('release-notes.md', '\n> npm 包已暂存，等待维护者在 npmjs.com → Staged Packages 使用 2FA 确认。GitHub Release 创建成功不代表 npm 已公开上架。\n');
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
