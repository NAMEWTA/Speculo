name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: Full check / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.22.3', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Test and validate all source assets
        run: pnpm check
      - name: Verify CLI entry and isolated tarball
        run: |
          pnpm verify-bin
          pnpm verify-package
      - name: Check all generated output is reproducible
        run: |
          pnpm verify-generated
          git diff --exit-code -- template

  artifact-and-media:
    runs-on: ubuntu-latest
    name: Installed artifact gates and real offline Media rendering
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the explicit test rendering environment
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('MEDIA_RENDER_CHROMIUM=' + p.chromium.executable_path + '\n')
          PY
      - name: Verify the tarball and installed Python renderer
        run: pnpm verify-package
        env:
          MEDIA_RENDER_REQUIRED: '1'
          MEDIA_RENDER_PYTHON: python
      - name: Execute registered deterministic artifact scenarios
        run: pnpm eval:run-artifacts --output /tmp/speculo-artifact-evaluation
      - name: Retain actual artifact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-artifact-evidence
          path: /tmp/speculo-artifact-evaluation
          if-no-files-found: ignore
          retention-days: 7
