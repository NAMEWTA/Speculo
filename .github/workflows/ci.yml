name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: Full check / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.22.3', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Test and validate all source assets
        run: pnpm check
      - name: Verify CLI entry and isolated tarball
        run: |
          pnpm verify-bin
          pnpm verify-package
      - name: Check all generated output is reproducible
        run: |
          pnpm verify-generated
          git diff --exit-code -- template
