name: Publish authorized v1.0.24 tag
on:
  push:
    branches: [automation/release-1.0.24-tag]
permissions:
  contents: write
  actions: write
concurrency:
  group: publish-speculo-v1.0.24
  cancel-in-progress: false
jobs:
  tag-and-verify:
    if: github.repository == 'NAMEWTA/Speculo' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Create fixed tag, dispatch native Release, verify each published target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const repo = 'NAMEWTA/Speculo';
          const sha = 'd5272da164f4e6e0aed6d0e58f3f3e520c6fef1e';
          const tag = 'v1.0.24';
          const version = '1.0.24';
          const receipt = {repo, sha, tag, version, phase: 'preflight', targets: {tag: 'pending', npm: 'pending', github_release: 'pending'}};
          function save() { writeFileSync(process.env.RUNNER_TEMP+'/release-1.0.24-receipt.json', JSON.stringify(receipt,null,2)+'\n'); }
          function api(endpoint, method='GET', body) {
            const args = ['api','--method',method, 'repos/'+repo+'/'+endpoint];
            if(body !== undefined) args.push('--input','-');
            const raw = execFileSync('gh',args,{encoding:'utf8',input:body === undefined ? undefined : JSON.stringify(body),timeout:60000});
            return raw.trim() ? JSON.parse(raw) : null;
          }
          async function json(url) {
            const res = await fetch(url,{signal:AbortSignal.timeout(30000)});
            assert.equal(res.status,200,`unreadable registry metadata: ${res.status}`);
            return res.json();
          }
          const pause = () => new Promise(resolve=>setTimeout(resolve,5000));
          async function waitForRun(id, deadline) {
            while(Date.now()<deadline) {
              const run=api('actions/runs/'+id);
              assert.equal(run.head_sha,sha,'run source drift');
              if(run.status==='completed') {
                assert.equal(run.conclusion,'success',`run ${id} did not succeed: ${run.conclusion}`);
                return run;
              }
              await pause();
            }
            throw new Error(`run ${id} has not completed within this verification budget`);
          }
          try {
            save();
            const ci=await waitForRun(38143934194,Date.now()+5*60*1000);
            assert.equal(ci.event,'push'); assert.equal(ci.head_branch,'main'); assert.equal(ci.path,'.github/workflows/ci.yml');
            receipt.ci_run_id=ci.id;
            assert.equal(api('git/ref/heads/main').object.sha,sha,'main moved; reassess release scope');
            const pkg=JSON.parse(Buffer.from(api('contents/package.json?ref='+sha).content,'base64').toString('utf8'));
            assert.equal(pkg.name,'@namewta/speculo'); assert.equal(pkg.version,version);
            const registry=await json('https://registry.npmjs.org/@namewta%2fspeculo');
            assert.ok(!registry.versions[version],'target already published; reconcile, do not republish');
            receipt.previous_latest=registry['dist-tags'].latest;
            assert.match(receipt.previous_latest,/^1\.0\.\d+$/);
            assert.ok(Number(receipt.previous_latest.split('.')[2])<24);
            assert.ok(!api('git/matching-refs/tags/'+tag).some(r=>r.ref==='refs/tags/'+tag),'tag already exists; never move it');
            const before=api('actions/workflows/release.yml/runs?head_sha='+sha+'&event=workflow_dispatch&per_page=100').workflow_runs;
            assert.ok(!before.some(r=>r.head_branch===tag),'release already dispatched; reconcile its run');
            receipt.phase='creating-tag'; save();
            const object=api('git/tags','POST',{tag,message:'Release v1.0.24\n\nAuthorized patch release of the merged SpecDev upgrade; fixed main commit verified by CI. AI-assisted release.',object:sha,type:'commit'});
            receipt.tag_object=object.sha; save();
            api('git/refs','POST',{ref:'refs/tags/'+tag,sha:object.sha});
            const actual=api('git/ref/tags/'+tag);
            assert.equal(actual.object.sha,object.sha);
            assert.equal(api('git/tags/'+object.sha).object.sha,sha);
            receipt.targets.tag='verified'; receipt.phase='dispatching-native-release'; save();
            api('actions/workflows/release.yml/dispatches','POST',{ref:tag});
            receipt.phase='native-release-dispatched'; save();
            console.log('Native release dispatched for '+tag+' at '+sha);
            let run;
            const discoveryDeadline=Date.now()+120000;
            while(Date.now()<discoveryDeadline) {
              const candidates=api('actions/workflows/release.yml/runs?head_sha='+sha+'&event=workflow_dispatch&per_page=100').workflow_runs.filter(r=>r.head_branch===tag&&!before.some(old=>old.id===r.id));
              assert.ok(candidates.length<=1,'ambiguous release runs');
              if(candidates.length===1) { run=candidates[0]; break; }
              await pause();
            }
            assert.ok(run,'dispatch accepted but run is not visible; inspect without redispatch');
            assert.equal(run.path,'.github/workflows/release.yml');
            receipt.release_run_id=run.id; receipt.release_run_url=run.html_url; save();
            console.log('NATIVE_RELEASE_RUN_ID='+run.id);
            await waitForRun(run.id,Date.now()+10*60*1000);
            receipt.phase='verifying-published-targets'; save();
            const release=api('releases/tags/'+tag);
            assert.equal(release.tag_name,tag); assert.equal(release.draft,false); assert.equal(release.prerelease,false); assert.ok(release.published_at);
            assert.ok(release.body.startsWith('## [1.0.24] - 2026-10-11'));
            assert.equal(api('releases/latest').id,release.id);
            assert.equal(api('git/ref/tags/'+tag).object.sha,receipt.tag_object);
            receipt.github_release={id:release.id,url:release.html_url,published_at:release.published_at};
            receipt.targets.github_release='verified'; save();
            let metadata;
            const registryDeadline=Date.now()+120000;
            while(Date.now()<registryDeadline) {
              const observed=await json('https://registry.npmjs.org/@namewta%2fspeculo');
              if(observed.versions[version] && observed['dist-tags'].latest===version) { metadata=observed; break; }
              await pause();
            }
            assert.ok(metadata,'npm version or latest tag not yet confirmed; do not republish');
            const published=metadata.versions[version];
            assert.equal(published.name,pkg.name); assert.equal(published.version,version);
            if(published.gitHead) assert.equal(published.gitHead,sha,'npm source commit mismatch');
            const url=new URL(published.dist.tarball);
            assert.equal(url.origin,'https://registry.npmjs.org');
            const download=await fetch(url,{signal:AbortSignal.timeout(60000)});
            assert.equal(download.status,200);
            const bytes=Buffer.from(await download.arrayBuffer());
            assert.equal('sha512-'+createHash('sha512').update(bytes).digest('base64'),published.dist.integrity,'tarball integrity mismatch');
            const archive=process.env.RUNNER_TEMP+'/namewta-speculo-1.0.24.tgz';
            writeFileSync(archive,bytes);
            const shipped=JSON.parse(execFileSync('tar',['-xOf',archive,'package/package.json'],{encoding:'utf8',timeout:30000}));
            assert.equal(shipped.name,pkg.name); assert.equal(shipped.version,version);
            assert.equal(shipped.bin.speculo,'./dist/src/cli.js');
            assert.ok(execFileSync('tar',['-xOf',archive,'package/dist/src/cli.js'],{timeout:30000}).length>0);
            receipt.npm={name:published.name,version:published.version,latest:metadata['dist-tags'].latest,gitHead:published.gitHead??null,tarball:url.href,integrity:published.dist.integrity,tarball_bytes:bytes.length,manifest_and_cli:'verified'};
            receipt.targets.npm='verified'; receipt.phase='completed'; save();
            console.log(JSON.stringify(receipt,null,2));
          } catch(error) {
            receipt.phase='blocked'; receipt.error=error.message; save();
            throw error;
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-1.0.24-receipt
          path: ${{ runner.temp }}/release-1.0.24-receipt.json
          retention-days: 7
