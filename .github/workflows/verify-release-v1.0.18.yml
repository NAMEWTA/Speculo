name: Verify published v1.0.18

on:
  push:
    branches: ['verify/release-v1.0.18']
    paths: ['.github/workflows/verify-release-v1.0.18.yml']

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'NAMEWTA/Speculo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: 1e698821a65cdd02a40e48f98e78e87ad498617b
    steps:
      - name: Checkout immutable release source, not verification branch
        uses: actions/checkout@v7
        with:
          ref: 1e698821a65cdd02a40e48f98e78e87ad498617b
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release refs and restored workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor 17038eeed6358d64849054fec87dacec80ab8d5e HEAD
          test "$(git hash-object .github/workflows/release.yml)" = '6ef7808ab6a61ab6ed4b024a963fb81aa6bc4807'
          gh api repos/NAMEWTA/Speculo/git/ref/tags/v1.0.18 > "$RUNNER_TEMP/tag.json"
          gh api repos/NAMEWTA/Speculo/releases/tags/v1.0.18 > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const read = name => JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, name), 'utf8'));
          assert.equal(read('tag.json').object.sha, process.env.RELEASE_SHA);
          const release = read('release.json');
          assert.equal(release.tag_name, 'v1.0.18');
          assert.equal(release.draft, false);
          assert.equal(release.prerelease, false);
          assert.ok(release.body.includes('## [1.0.18]'));
          console.log('Immutable release tag, published release, OPS ancestry and restored workflow verified.');
          NODE

      - name: Setup release build environment
        uses: ./.github/actions/setup
        with:
          node-version: '22.22.3'

      - name: Rebuild expected package from release commit
        run: |
          pnpm build
          pnpm verify-bin
          mkdir "$RUNNER_TEMP/expected-package"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/expected-package" > "$RUNNER_TEMP/expected-pack.json"
          git diff --exit-code

      - name: Verify npm metadata and downloaded tarball integrity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const base = 'https://registry.npmjs.org/@namewta%2fspeculo/';
          const get = async url => {
            const response = await fetch(url, { signal: AbortSignal.timeout(30000), redirect: 'error' });
            assert.equal(response.status, 200, `HTTP ${response.status} for ${url}`);
            return response;
          };
          const exact = await (await get(base + '1.0.18')).json();
          const latest = await (await get(base + 'latest')).json();
          assert.equal(exact.name, '@namewta/speculo');
          assert.equal(exact.version, '1.0.18');
          assert.equal(latest.version, '1.0.18');
          // npm gitHead is optional; verify any provided value, then independently
          // compare all archive file bytes with a clean build of the release commit.
          if (exact.gitHead !== undefined) assert.equal(exact.gitHead, process.env.RELEASE_SHA);
          const url = new URL(exact.dist.tarball);
          assert.equal(url.protocol, 'https:');
          assert.equal(url.hostname, 'registry.npmjs.org');
          assert.equal(url.username + url.password + url.port, '');
          const bytes = Buffer.from(await (await get(url.href)).arrayBuffer());
          assert.ok(bytes.length > 0 && bytes.length < 20_000_000);
          const integrity = 'sha512-' + createHash('sha512').update(bytes).digest('base64');
          const shasum = createHash('sha1').update(bytes).digest('hex');
          assert.equal(exact.dist.integrity, integrity);
          assert.equal(exact.dist.shasum, shasum);
          assert.equal(shasum, 'cf5c03544a8e25b7c86423e8d8c5a29d0d122558');
          writeFileSync(join(process.env.RUNNER_TEMP, 'published.tgz'), bytes);
          const evidence = { package: exact.name, version: exact.version, latest: latest.version, gitHead: exact.gitHead ?? null, integrity, shasum, release_commit: process.env.RELEASE_SHA, release: 'https://github.com/NAMEWTA/Speculo/releases/tag/v1.0.18' };
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-evidence.json'), JSON.stringify(evidence, null, 2));
          console.log('npm version/latest and downloaded SHA-512/SHA-1 verified; gitHead:', exact.gitHead ?? 'not provided by npm');
          NODE

      - name: Compare every published package file with release-source build
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          def inventory(archive):
              files, seen, total = {}, set(), 0
              with tarfile.open(archive, 'r:gz') as tar:
                  for member in tar:
                      parts = member.name.split('/')
                      assert parts[0] == 'package' and '..' not in parts and '\\' not in member.name, member.name
                      assert member.name not in seen, 'Duplicate archive member'
                      seen.add(member.name)
                      assert len(seen) <= 2000, 'Excess archive members'
                      if member.isdir():
                          continue
                      assert member.isfile(), 'Non-regular archive member'
                      total += member.size
                      assert total < 50_000_000, 'Archive too large'
                      with tar.extractfile(member) as f:
                          data = f.read()
                      assert len(data) == member.size
                      files[member.name] = hashlib.sha256(data).hexdigest()
              return files
          preview = json.loads((root / 'expected-pack.json').read_text())[0]
          assert preview['name'] == '@namewta/speculo' and preview['version'] == '1.0.18'
          filename = preview['filename']
          assert pathlib.Path(filename).name == filename
          expected = inventory(root / 'expected-package' / filename)
          published = inventory(root / 'published.tgz')
          assert expected.keys() == published.keys(), {'missing': sorted(expected.keys() - published.keys()), 'extra': sorted(published.keys() - expected.keys())}
          mismatches = [name for name in expected if expected[name] != published[name]]
          assert not mismatches, {'different_file_bytes': mismatches}
          assert len(published) == 459, 'Unexpected package file count'
          evidence = json.loads((root / 'release-evidence.json').read_text())
          evidence.update({'compared_files': len(published), 'all_file_bytes_match_release_build': True, 'original_release_workflow_restored': True, 'verification_only_no_publication': True})
          text = json.dumps(evidence, indent=2)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Published v1.0.18 verified\n\nAll 459 packaged files match the immutable release source build byte-for-byte. No version or tag was changed and nothing was republished.\n\n```json\n' + text + '\n```\n')
          PY
