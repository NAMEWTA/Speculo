name: Cleanup merged branches once

"on":
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-merged-branches-once.yml]

permissions: {}

concurrency:
  group: speculo-merged-branches-2026-11-11
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'NAMEWTA/Speculo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify ancestry and delete only the two unchanged branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = "NAMEWTA/Speculo"
          expected = {
              "refactor/v3-lean-release-workflow": "16704dab5083d25b5f7f3dd3568b0270b49c9531",
              "dependabot/npm_and_yarn/semver-7.8.6": "acda27e105743377151fb7a5e52d4994dc8df588",
          }
          main_sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          if os.environ["GITHUB_REPOSITORY"] != repository or not re.fullmatch(r"[0-9a-f]{40}", main_sha):
              raise SystemExit("Unexpected repository or workflow commit; no deletion.")

          def get(path, allow_missing=False):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}" + ("/" + path if path else ""),
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise SystemExit(f"GitHub API returned HTTP {error.code}; no automatic retry.") from None

          def head(branch):
              reference = get("git/ref/heads/" + urllib.parse.quote(branch, safe=""), allow_missing=True)
              if reference is None:
                  return None
              if reference.get("ref") != "refs/heads/" + branch or reference.get("object", {}).get("type") != "commit":
                  raise SystemExit(f"Unexpected ref response for {branch}; no deletion.")
              return reference["object"]["sha"]

          if get("")["default_branch"] != "main" or head("main") != main_sha:
              raise SystemExit("Default branch or main moved; no deletion.")

          pending = {}
          for branch, sha in expected.items():
              current = head(branch)
              if current not in (None, sha):
                  raise SystemExit(f"{branch} moved; no deletion.")
              comparison = get(f"compare/{sha}...{main_sha}")
              if comparison.get("merge_base_commit", {}).get("sha") != sha or comparison.get("status") not in ("ahead", "identical"):
                  raise SystemExit(f"{branch} is not fully merged into this main commit; no deletion.")
              if current is not None:
                  pending[branch] = sha

          if head("main") != main_sha or any(head(branch) != sha for branch, sha in pending.items()):
              raise SystemExit("A checked head moved; no deletion.")

          if pending:
              # Explicit leases guard branch heads atomically; REST DELETE has no expected-SHA argument.
              credential = base64.b64encode(f"x-access-token:{token}".encode()).decode()
              environment = {
                  key: value for key, value in os.environ.items()
                  if not key.startswith("GIT_") and key not in ("GH_TOKEN", "GITHUB_TOKEN")
              }
              environment.update({
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_CONFIG_GLOBAL": "/dev/null",
                  "GIT_TERMINAL_PROMPT": "0",
                  "GIT_CONFIG_COUNT": "1",
                  "GIT_CONFIG_KEY_0": "http.https://github.com/.extraheader",
                  "GIT_CONFIG_VALUE_0": "AUTHORIZATION: basic " + credential,
              })
              with tempfile.TemporaryDirectory(prefix="speculo-ref-cleanup-") as directory:
                  subprocess.run(["git", "init", "--bare", "--quiet", directory], env=environment, check=True, timeout=30)
                  command = ["git", "-C", directory, "push", "--atomic", "--porcelain"]
                  command.extend(f"--force-with-lease=refs/heads/{branch}:{sha}" for branch, sha in pending.items())
                  command.append(f"https://github.com/{repository}.git")
                  command.extend(f":refs/heads/{branch}" for branch in pending)
                  result = subprocess.run(command, env=environment, text=True, capture_output=True, timeout=90)
                  if result.returncode:
                      raise SystemExit(f"Atomic deletion rejected (exit {result.returncode}); no retry.")
                  print("Deleted exact refs: " + ", ".join("refs/heads/" + branch for branch in pending))

          if head("main") != main_sha or any(head(branch) is not None for branch in expected):
              raise SystemExit("Final ref verification failed; inspect current heads before any follow-up.")
          print("Verified main unchanged and both merged branches absent.")
